name: Validate package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      RESEARCH_TEST_TMPDIR: .validation/skill-tests
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional publisher test dependencies
        run: python -m pip install -r skills/ai-investment-research/requirements-report.txt
      - name: Core, installer, chart and publisher tests
        run: python -B -m unittest discover -s skills/ai-investment-research/scripts -p "test_*.py" -v
      - name: Verify source hashes, authored links and package hygiene
        run: python -B tools/verify_repo.py
      - name: Exercise stdlib synthetic demo
        run: python -B tools/demo.py --output "${{ runner.temp }}/air-synthetic-demo"
      - name: Build installable Skill archive
        run: python -B tools/build_package.py --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: skill-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/
